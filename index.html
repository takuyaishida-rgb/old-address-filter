<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旧住所フィルター</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }

  .card { background: #fff; border-radius: 10px; padding: 28px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: #444; }

  .drop-zone {
    border: 2px dashed #ccc; border-radius: 8px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: .15s;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: #2563eb; background: #eff6ff; }
  .drop-zone .icon { font-size: 36px; margin-bottom: 10px; }
  .drop-zone p { font-size: 14px; color: #666; }
  .drop-zone input { display: none; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fff; }

  .btn {
    display: inline-block; padding: 11px 28px; background: #2563eb; color: #fff;
    border: none; border-radius: 7px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .15s; width: 100%;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #93c5fd; cursor: not-allowed; }

  .result { display: none; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat { flex: 1; background: #f8fafc; border-radius: 8px; padding: 16px; text-align: center; }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .num.red { color: #dc2626; }
  .stat .num.green { color: #16a34a; }
  .stat .label { font-size: 12px; color: #666; margin-top: 2px; }

  .dl-btn {
    display: inline-block; padding: 11px 28px; background: #16a34a; color: #fff;
    border: none; border-radius: 7px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .15s; width: 100%; text-align: center;
  }
  .dl-btn:hover { background: #15803d; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f1f5f9; padding: 8px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-weight: 600; }
  td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge.old { background: #fee2e2; color: #dc2626; }
  .reason { color: #888; font-size: 11px; }

  .note { font-size: 12px; color: #888; margin-top: 8px; }
  #filename { font-size: 13px; color: #2563eb; margin-top: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <h1>旧住所フィルター</h1>
  <p class="subtitle">Excelファイルの住所列をチェックし、旧住所の可能性がある行をフラグします。<br>ファイルはブラウザ内のみで処理され、サーバーには送信されません。</p>

  <div class="card">
    <h2>① ファイルを選択</h2>
    <div class="drop-zone" id="dropZone">
      <div class="icon">📂</div>
      <p>クリックまたはドラッグ&ドロップ</p>
      <p>.xlsx / .xls / .csv に対応</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    </div>
    <div id="filename"></div>
  </div>

  <div class="card" id="configCard" style="display:none">
    <h2>② 住所列を選択</h2>
    <div class="field">
      <label>住所が入っている列</label>
      <select id="colSelect"></select>
    </div>
    <p class="note">※ ヘッダー行がある場合は自動で検出します</p>
    <br>
    <button class="btn" id="runBtn" onclick="run()">判定を実行</button>
  </div>

  <div class="card result" id="resultCard">
    <h2>③ 結果</h2>
    <div class="stats">
      <div class="stat">
        <div class="num" id="statTotal">-</div>
        <div class="label">総件数</div>
      </div>
      <div class="stat">
        <div class="num red" id="statOld">-</div>
        <div class="label">旧住所の可能性あり</div>
      </div>
      <div class="stat">
        <div class="num green" id="statOk">-</div>
        <div class="label">問題なし</div>
      </div>
    </div>
    <button class="dl-btn" id="dlBtn">📥 判定済みファイルをダウンロード</button>
    <br><br>
    <h2>旧住所検出一覧（最大50件表示）</h2>
    <table id="previewTable">
      <thead><tr><th>#</th><th>住所</th><th>判定理由</th></tr></thead>
      <tbody id="previewBody"></tbody>
    </table>
  </div>
</div>

  "月ヶ瀬村","都祁村","榛原町","大宇陀町","西吉野村",
  "打田町","粉河町","南部町","熊野川町",

// 旧字体
const OLD_KANJI = /[國縣區驛濱邊澤關藏櫻龍廳]/;
// 漢数字番地
const KANJI_BANCHI = /[一二三四五六七八九十百千]+(番地|番)/;
// カタカナ「ノ」区切り
const KATAKANA_NO = /[0-9０-９]+ノ[0-9０-９]+/;

// 住所コンポーネントの境界：キーワードの直後に来る典型的な文字
// 大字・丁目・番地・数字（半角/全角）・漢数字・空白・中点、または文末
const ADDR_BOUNDARY = '(?=[大字丁番地号\\d０-９一二三四五六七八九十百千\\s・]|$)';

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function judgeOldAddress(address) {
  if (!address || typeof address !== 'string' || !address.trim()) return { isOld: false, reason: '' };
  const reasons = [];

  // 消滅郡名：部分一致（完全消滅した郡名なので誤検知リスク低）
  for (const d of EXTINCT_DISTRICTS) {
    if (address.includes(d)) reasons.push(`消滅郡名「${d}」`);
  }

  // 消滅地名：前方一致（住所コンポーネント境界でのみマッチ）
  // 例: 「高津町1-2-3」→ ヒット / 「高津町通り」→ スルー
  for (const t of OLD_TOWNS) {
    const re = new RegExp(escapeRegex(t) + ADDR_BOUNDARY);
    if (re.test(address)) reasons.push(`消滅地名「${t}」`);
  }

  const m = address.match(OLD_KANJI);
  if (m) reasons.push(`旧字体「${m[0]}」`);
  if (KANJI_BANCHI.test(address)) reasons.push('漢数字番地');
  if (KATAKANA_NO.test(address)) reasons.push('カタカナ「ノ」区切り');
  return { isOld: reasons.length > 0, reason: reasons.join(' / ') };
}

// ============================================================
// UI
// ============================================================
let workbook = null;
let sheetData = null;
let fileName = '';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

function loadFile(file) {
  if (!file) return;
  fileName = file.name;
  document.getElementById('filename').textContent = '選択中: ' + fileName;
  const reader = new FileReader();
  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    sheetData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

    // 列選択を構築
    const select = document.getElementById('colSelect');
    select.innerHTML = '';
    if (sheetData.length > 0) {
      const headers = sheetData[0];
      headers.forEach((h, i) => {
        const col = String.fromCharCode(65 + i);
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${col}列: ${h || '(空)'}`;
        // 「住所」を含む列をデフォルト選択
        if (String(h).includes('住所')) opt.selected = true;
        select.appendChild(opt);
      });
    }
    document.getElementById('configCard').style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';
  };
  reader.readAsArrayBuffer(file);
}

function run() {
  if (!sheetData) return;
  const colIdx = parseInt(document.getElementById('colSelect').value);
  const rows = sheetData.slice(1); // ヘッダー除く

  let oldCount = 0;
  const previewRows = [];
  const resultData = [sheetData[0].concat(['旧住所フラグ', '判定理由'])];

  rows.forEach((row, i) => {
    const address = String(row[colIdx] || '');
    const { isOld, reason } = judgeOldAddress(address);
    if (isOld) oldCount++;
    const newRow = row.concat([isOld ? 'TRUE' : 'FALSE', reason]);
    resultData.push(newRow);
    if (isOld && previewRows.length < 50) {
      previewRows.push({ rowNum: i + 2, address, reason });
    }
  });

  const total = rows.length;
  document.getElementById('statTotal').textContent = total.toLocaleString();
  document.getElementById('statOld').textContent = oldCount.toLocaleString();
  document.getElementById('statOk').textContent = (total - oldCount).toLocaleString();

  // プレビューテーブル
  const tbody = document.getElementById('previewBody');
  tbody.innerHTML = '';
  if (previewRows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#888;padding:20px">旧住所は検出されませんでした</td></tr>';
  } else {
    previewRows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.rowNum}</td><td>${escHtml(r.address)}</td><td class="reason">${escHtml(r.reason)}</td>`;
      tbody.appendChild(tr);
    });
  }

  // ダウンロードボタン
  document.getElementById('dlBtn').onclick = () => {
    const ws = XLSX.utils.aoa_to_sheet(resultData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    const base = fileName.replace(/\.[^.]+$/, '');
    XLSX.writeFile(wb, base + '_旧住所判定済.xlsx');
  };

  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
